<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS500 Quickshifter</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1b; --muted:#666; --line:#ddd; --accent:#0a7cff; --good:#1a9c4b; --warn:#d98200; --bad:#d6342c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1f1f1f; --ink:#f0f0f0; --muted:#9a9a9a; --line:#333; --accent:#4da3ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:0 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  button { font:inherit; border:0; border-radius:8px; padding:10px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .status { color:var(--muted); font-size:14px; }
  .live { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; }
  .live div b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .live div span { color:var(--muted); font-size:13px; }
  .bar { position:relative; height:16px; background:var(--line); border-radius:8px; overflow:hidden; margin-top:12px; }
  .bar i { position:absolute; left:50%; top:0; bottom:0; width:0; background:var(--accent); }
  .bar u { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); }
  label { display:block; margin-top:14px; font-weight:600; }
  label small { font-weight:400; color:var(--muted); }
  input[type=range] { width:100%; }
  .val { float:right; font-variant-numeric:tabular-nums; font-weight:400; color:var(--muted); }
  select, input[type=checkbox] { font:inherit; }
  #state { font-weight:700; }
  .idle { color:var(--muted); } .cutting { color:var(--bad); } .lockout { color:var(--warn); } .limiter { color:var(--bad); }
  .note { color:var(--muted); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<h1>GS500 Quickshifter</h1>

<div class="card">
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" class="secondary" disabled>Disconnect</button>
    <span class="status" id="status">Not connected</span>
  </div>
  <div class="status" id="support" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="live">
    <div><b id="force">-</b><span>force</span></div>
    <div><b id="rpm">-</b><span>rpm</span></div>
    <div><b id="state" class="idle">-</b><span>state</span></div>
  </div>
  <div class="bar"><i id="fbar"></i><u id="tmark"></u></div>
  <div class="status" style="margin-top:6px">Bar: force from zero. Red line: threshold.</div>
</div>

<div class="card" id="settings">
  <h2>Quickshifter</h2>
  <label>Threshold <small>counts above zero</small><span class="val" id="v_threshold"></span>
    <input type="range" id="threshold" min="10" max="3000" step="10"></label>
  <label>Cut time <small>ms</small><span class="val" id="v_cutMs"></span>
    <input type="range" id="cutMs" min="10" max="150" step="5"></label>
  <label>Lockout <small>ms after a cut</small><span class="val" id="v_lockoutMs"></span>
    <input type="range" id="lockoutMs" min="50" max="1000" step="10"></label>
  <label>RPM min <small>no cut below</small><span class="val" id="v_rpmMin"></span>
    <input type="range" id="rpmMin" min="0" max="12000" step="100"></label>
  <label>RPM max <small>no cut above</small><span class="val" id="v_rpmMax"></span>
    <input type="range" id="rpmMax" min="0" max="14000" step="100"></label>
  <label>Pulses per revolution <small>calibrate so rpm matches your tacho</small><span class="val" id="v_ppr"></span>
    <input type="range" id="ppr100" min="10" max="400" step="5"></label>
  <label>Upshift direction
    <select id="direction"><option value="0">Force counts go up</option><option value="1">Force counts go down</option></select></label>
  <label><input type="checkbox" id="enabled"> Enabled <small>(off = bypass, nothing ever cuts)</small></label>
</div>

<div class="card">
  <h2>Rev limiter and pops</h2>
  <label><input type="checkbox" id="limMode"> Rev limiter on <small>(off by default)</small></label>
  <label>Limiter RPM<span class="val" id="v_limRpm"></span>
    <input type="range" id="limRpm" min="3000" max="12000" step="100"></label>
  <label>Cut time <small>ms, longer = bigger bangs</small><span class="val" id="v_limCutMs"></span>
    <input type="range" id="limCutMs" min="10" max="150" step="5"></label>
  <label>Spark on between cuts <small>ms, shorter = more bangs per second</small><span class="val" id="v_limGapMs"></span>
    <input type="range" id="limGapMs" min="10" max="200" step="5"></label>
  <div class="note">Start with 40 / 40 ms and the limiter 500 rpm under your real limit. Test on a stand first. The limiter only works while the RPM reading is valid.</div>
  <div class="row" style="margin-top:16px">
    <button id="read" disabled>Read from device</button>
    <button id="save" disabled>Save to device</button>
  </div>
</div>

<script>
const SERVICE = '6e7d0001-b5a3-f393-e0a9-e50e24dcca9e';
const CONFIG  = '6e7d0002-b5a3-f393-e0a9-e50e24dcca9e';
const LIVE    = '6e7d0003-b5a3-f393-e0a9-e50e24dcca9e';
const $ = id => document.getElementById(id);
let device, cfgChar, liveChar;

const FIELDS = ['threshold','cutMs','lockoutMs','rpmMin','rpmMax','ppr100','limRpm','limCutMs','limGapMs'];
function showVals() {
  FIELDS.forEach(f => { $('v_' + (f === 'ppr100' ? 'ppr' : f)).textContent = f === 'ppr100' ? ($(f).value / 100).toFixed(2) : $(f).value; });
  $('tmark').style.left = (50 + 50 * Math.min(1, $('threshold').value / 3000)) + '%';
}
FIELDS.forEach(f => $(f).addEventListener('input', showVals));
showVals();

// 19 bytes, little endian. Must match struct Config in quickshifter.ino
function decodeConfig(dv) {
  return { threshold: dv.getInt16(0, true), cutMs: dv.getUint16(2, true), lockoutMs: dv.getUint16(4, true),
           rpmMin: dv.getUint16(6, true), rpmMax: dv.getUint16(8, true), ppr100: dv.getUint16(10, true),
           direction: dv.getUint8(12), enabled: dv.getUint8(13),
           limRpm: dv.getUint16(14, true), limCutMs: dv.getUint8(16), limGapMs: dv.getUint8(17), limMode: dv.getUint8(18) };
}
function encodeConfig() {
  const b = new ArrayBuffer(19), dv = new DataView(b);
  dv.setInt16(0, +$('threshold').value, true); dv.setUint16(2, +$('cutMs').value, true);
  dv.setUint16(4, +$('lockoutMs').value, true); dv.setUint16(6, +$('rpmMin').value, true);
  dv.setUint16(8, +$('rpmMax').value, true); dv.setUint16(10, +$('ppr100').value, true);
  dv.setUint8(12, +$('direction').value); dv.setUint8(13, $('enabled').checked ? 1 : 0);
  dv.setUint16(14, +$('limRpm').value, true); dv.setUint8(16, +$('limCutMs').value);
  dv.setUint8(17, +$('limGapMs').value); dv.setUint8(18, $('limMode').checked ? 1 : 0);
  return b;
}
function applyConfig(c) {
  FIELDS.forEach(f => $(f).value = c[f]);
  $('direction').value = c.direction; $('enabled').checked = !!c.enabled; $('limMode').checked = !!c.limMode; showVals();
}

async function readConfig() {
  const dv = await cfgChar.readValue();
  if (dv.byteLength < 19) throw new Error('Firmware is older than this page. Flash the new quickshifter.ino.');
  applyConfig(decodeConfig(dv));
  $('status').textContent = 'Settings read from device';
}
async function saveConfig() {
  await cfgChar.writeValue(encodeConfig());
  await readConfig();                       // device clamps values; show what it really stored
  $('status').textContent = 'Saved';
}

function onLive(e) {
  const dv = e.target.value, force = dv.getInt16(0, true), rpm = dv.getUint16(2, true), st = dv.getUint8(4);
  $('force').textContent = force; $('rpm').textContent = rpm;
  const s = ['idle', 'cutting', 'lockout', 'limiter'][st] || '?';
  $('state').textContent = s; $('state').className = s;
  const frac = Math.max(-1, Math.min(1, force / 3000)), bar = $('fbar');
  bar.style.left = (frac >= 0 ? 50 : 50 + frac * 50) + '%'; bar.style.width = Math.abs(frac) * 50 + '%';
}

async function connect() {
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }], optionalServices: [SERVICE] });
    device.addEventListener('gattserverdisconnected', () => {
      $('status').textContent = 'Disconnected'; ['disconnect','read','save'].forEach(i => $(i).disabled = true); $('connect').disabled = false;
    });
    $('status').textContent = 'Connecting...';
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    cfgChar = await svc.getCharacteristic(CONFIG);
    liveChar = await svc.getCharacteristic(LIVE);
    liveChar.addEventListener('characteristicvaluechanged', onLive);
    await liveChar.startNotifications();
    await readConfig();
    ['disconnect','read','save'].forEach(i => $(i).disabled = false); $('connect').disabled = true;
    $('status').textContent = 'Connected to ' + device.name;
  } catch (err) { $('status').textContent = 'Error: ' + err.message; }
}

$('connect').onclick = connect;
$('disconnect').onclick = () => device && device.gatt.disconnect();
$('read').onclick = () => readConfig().catch(e => $('status').textContent = 'Error: ' + e.message);
$('save').onclick = () => saveConfig().catch(e => $('status').textContent = 'Error: ' + e.message);

if (!navigator.bluetooth) {
  $('support').textContent = 'This browser has no Web Bluetooth. Use Chrome on Android or desktop, or Bluefy on iPhone.';
  $('connect').disabled = true;
}
</script>
</body>
</html>
